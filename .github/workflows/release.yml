# Выпуск релиза: при push тега v1.2.3 (или вручную) собираются автономные однофайловые программы
# (консольная — для Windows, Linux, macOS; с графическим интерфейсом — для Windows) и прикладываются к релизу.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v2.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Создать релиз (если его ещё нет)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Релиз $TAG уже существует"
          else
            gh release create "$TAG" --title "WellPadOptimizer $TAG" --generate-notes --target "${{ github.sha }}"
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
            exe: WellPadOptimizer.exe
            gui: true
          - rid: linux-x64
            os: ubuntu-24.04
            exe: WellPadOptimizer
            gui: false
          - rid: osx-arm64
            os: macos-14
            exe: WellPadOptimizer
            gui: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Скачать Plotly для встраивания в отчёт
        run: |
          mkdir -p assets
          if [ ! -s assets/plotly.min.js ]; then
            curl -fsSL --retry 3 -o assets/plotly.min.js https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js \
              || curl -fsSL --retry 3 -o assets/plotly.min.js https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js
          fi
          test $(wc -c < assets/plotly.min.js) -gt 1000000

      - name: Publish — консольная программа
        run: |
          dotnet publish src/WellPadOptimizer.Cli/WellPadOptimizer.Cli.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:Version=${TAG#v} \
            -o "$GITHUB_WORKSPACE/publish/cli"

      - name: Publish — графический интерфейс (Windows)
        if: matrix.gui
        run: |
          dotnet publish src/WellPadOptimizer.Gui/WellPadOptimizer.Gui.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:Version=${TAG#v} \
            -o "$GITHUB_WORKSPACE/publish/gui"

      - name: Упаковать
        id: pkg
        run: |
          PKG="WellPadOptimizer-$TAG-${{ matrix.rid }}"
          OUT="$GITHUB_WORKSPACE/dist/$PKG"
          mkdir -p "$OUT"
          cp "publish/cli/${{ matrix.exe }}" "$OUT/"
          if [ "${{ matrix.gui }}" = "true" ]; then cp publish/gui/WellPadOptimizerGui.exe "$OUT/"; fi
          cp settings.json "$OUT/"
          [ -f README.md ] && cp README.md "$OUT/"
          [ -d data ] && cp -r data "$OUT/"
          cd "$GITHUB_WORKSPACE/dist"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            chmod +x "$PKG/${{ matrix.exe }}"
            zip -qr "$PKG.zip" "$PKG"
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Проверочный запуск собранной программы
        working-directory: dist/${{ steps.pkg.outputs.name }}
        run: |
          ./${{ matrix.exe }} --input data/input_mass.json --out results --no-pause
          test -f results/report.html

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/${{ steps.pkg.outputs.name }}.zip" --clobber --repo "${{ github.repository }}"
