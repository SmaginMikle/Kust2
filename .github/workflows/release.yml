# Выпуск релиза: при push тега вида v1.2.3 (или вручную) собираются автономные однофайловые
# исполняемые файлы для Windows, Linux и macOS и прикладываются к релизу GitHub.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v1.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Создать релиз (если его ещё нет)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Релиз $TAG уже существует"
          else
            gh release create "$TAG" --title "WellPadOptimizer $TAG" --generate-notes --target "${{ github.sha }}"
          fi

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
            exe: WellPadOptimizer.exe
          - rid: linux-x64
            os: ubuntu-24.04
            exe: WellPadOptimizer
          - rid: osx-arm64
            os: macos-14
            exe: WellPadOptimizer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Найти проект
        id: proj
        run: |
          PROJ=$(git ls-files '*.csproj' | head -n 1)
          if [ -z "$PROJ" ]; then echo "::error::не найден .csproj"; exit 1; fi
          echo "dir=$(dirname "$PROJ")" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$PROJ")" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Скачать Plotly для встраивания в отчёт
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          mkdir -p assets
          if [ ! -s assets/plotly.min.js ]; then
            curl -fsSL --retry 3 -o assets/plotly.min.js https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js \
              || curl -fsSL --retry 3 -o assets/plotly.min.js https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js
          fi
          ls -l assets/plotly.min.js
          test $(wc -c < assets/plotly.min.js) -gt 1000000

      - name: Publish (single file, self-contained)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          dotnet publish ${{ steps.proj.outputs.file }} -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:Version=${{ steps.proj.outputs.version }} \
            -o "$GITHUB_WORKSPACE/publish/${{ matrix.rid }}"

      - name: Упаковать
        id: pkg
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          PKG="WellPadOptimizer-$TAG-${{ matrix.rid }}"
          OUT="$GITHUB_WORKSPACE/dist/$PKG"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/publish/${{ matrix.rid }}/${{ matrix.exe }}" "$OUT/"
          cp settings.json "$OUT/"
          [ -f README.md ] && cp README.md "$OUT/"
          [ -d data ] && cp -r data "$OUT/"
          cd "$GITHUB_WORKSPACE/dist"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else
            chmod +x "$PKG/${{ matrix.exe }}"
            zip -qr "$PKG.zip" "$PKG"
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Проверочный запуск собранного файла
        working-directory: dist/${{ steps.pkg.outputs.name }}
        run: |
          if [ -f data/input_mass.json ]; then
            ./${{ matrix.exe }} --input data/input_mass.json --map data/terrain_map.asc --settings settings.json --out results --no-pause
            test -f results/report.html
          else
            echo "::warning::нет data/input_mass.json — запуск пропущен"
          fi

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/${{ steps.pkg.outputs.name }}.zip" --clobber --repo "${{ github.repository }}"
