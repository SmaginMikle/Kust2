# Сборка и проверочный расчёт при каждом push / pull request
name: build

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WellPadOptimizer.csproj

      - name: Build
        run: dotnet build WellPadOptimizer.csproj -c Release --no-restore
