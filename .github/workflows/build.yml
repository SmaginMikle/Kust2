# Сборка решения (ядро, консоль, интерфейс WPF) и проверочные расчёты при каждом push / pull request
name: build

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Скачать Plotly для встраивания в отчёт
        shell: bash
        run: |
          mkdir -p assets
          if [ ! -s assets/plotly.min.js ]; then
            curl -fsSL --retry 3 -o assets/plotly.min.js https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js \
              || curl -fsSL --retry 3 -o assets/plotly.min.js https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js
          fi
          test $(wc -c < assets/plotly.min.js) -gt 1000000

      - name: Restore
        run: dotnet restore WellPadOptimizer.sln

      # WPF-интерфейс собирается и на Linux благодаря EnableWindowsTargeting (запускается только в Windows)
      - name: Build
        run: dotnet build WellPadOptimizer.sln -c Release --no-restore

      - name: Расчёт без карты (вся поверхность — суходол)
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/input_mass.json --out ci_results/no_map --no-pause

      - name: Расчёт по карте КИН
        if: hashFiles('data/kin_map_example.bin') != ''
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/input_mass.json --map-source Kin --map data/kin_map_example.bin --out ci_results/kin --no-pause

      - name: Расчёт по таблице Excel (СК-42, Гаусс–Крюгер)
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/wells_example.xlsx --map-source Kin --map data/kin_map_example.bin --out ci_results/xlsx --no-pause

      - name: Расчёт по таблице CSV (координаты без проекции)
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/wells_example.csv --out ci_results/csv --no-pause

      - name: Расчёт с Z-кустами
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/input_mass.json --pad-layout Auto --out ci_results/z --no-pause

      - name: Расчёт с существующими скважинами и жёсткими ограничениями (сравнение)
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/input_mass.json --existing data/existing_wells_example.csv --constraints Both --out ci_results/anticollision --no-pause

      - name: Расчёт по OpenStreetMap (Overpass API)
        continue-on-error: true
        run: dotnet run --project src/WellPadOptimizer.Cli -c Release --no-build -- --input data/input_mass.json --map-source Osm --osm-mode Overpass --out ci_results/osm --no-pause

      - name: Сохранить результаты расчётов
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-results
          path: ci_results/
          if-no-files-found: ignore
          retention-days: 14
